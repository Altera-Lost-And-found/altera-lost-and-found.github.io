<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Altera's lost and found lists, leaderboard and hall of fame.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a100d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234fc98d'/%3E%3C/svg%3E">
<title>Altera Lost &amp; Found</title>
<link id="lf-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="lf-css">
/* Layout: a lost-property office after hours. Claim-ticket rows, a hall of fame up top, editions as tabbed ledgers. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --bg: #0a100d;
  --surface: #111a15;
  --surface-2: #17231c;
  --line: #24352b;
  --fg: #e4eee8;
  --muted: #8ea597;
  --green: #4fc98d;
  --green-soft: #1d4a35;
  --lost: #ef8f6f;
  --lost-soft: #3a211a;
  --gold: #e8bb4f;
  --gold-soft: #3a2e12;
  --silver: #c3ced3;
  --silver-soft: #262d30;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--body);
  margin: 0;
  padding-inline: 16px;
  padding-block: 0 48px;
  background-image: radial-gradient(1200px 500px at 85% -10%, rgba(79,201,141,.10), transparent 60%);
  background-repeat: no-repeat;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 56px; }
a { color: var(--green); }
button, label.btn { font: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font: 800 20px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 999px; }
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* like button (GitHub build only; the counter service is unreachable inside claude.ai) */
.like { position: relative; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; user-select: none; }
.like:hover { border-color: var(--lost); }
.like svg { width: 18px; height: 18px; fill: var(--lost); display: block; }
.like.pop svg { animation: pop .3s ease-out; }
.like-count[data-empty] { color: var(--muted); }
.float-heart { position: absolute; left: 50%; bottom: 60%; width: 16px; height: 16px; margin-left: -8px; pointer-events: none; fill: var(--lost); animation: rise 1.1s ease-out forwards; }
@keyframes rise {
  0% { transform: translate(0, 0) scale(.6); opacity: 1; }
  100% { transform: translate(var(--dx, 0px), -70px) scale(1.25); opacity: 0; }
}
@keyframes pop { 50% { transform: scale(1.3); } }
@keyframes fade { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .float-heart { animation: fade .8s ease-out forwards; }
  .like.pop svg { animation: none; }
}

/* hero */
.hero { display: grid; gap: 28px; padding-top: 8px; }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
h1 { font: 900 clamp(48px, 10vw, 112px)/.88 var(--display); text-transform: uppercase; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .amp { color: var(--green); }
.lede { max-width: 58ch; color: var(--muted); font-size: 17px; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { padding: 18px 20px; display: grid; gap: 4px; background: var(--surface); }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.lost b { color: var(--lost); }
.stat.found b { color: var(--green); }
.stat.next { background: var(--green-soft); }
.stat.next b { color: var(--fg); }

/* section heads */
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h2 { font: 800 clamp(32px, 5vw, 48px)/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .01em; }
.sec-head p { margin: 0; color: var(--muted); max-width: 52ch; font-size: 14px; }

/* hall of fame */
.fame { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.board-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.board-title h3 { font: 800 26px/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .03em; }
.board.lost .board-title h3 { color: var(--lost); }
.board.found .board-title h3 { color: var(--green); }
.chip { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.medal { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.medal.gold { box-shadow: inset 0 0 0 1px rgba(232,187,79,.35); }
.medal.silver { box-shadow: inset 0 0 0 1px rgba(195,206,211,.22); }
.photo { position: relative; width: 116px; aspect-ratio: 1; max-width: 100%; margin: 0; border-radius: 14px; overflow: hidden; display: grid; place-items: center; }
.gold .photo { background: var(--gold-soft); border: 2px solid var(--gold); }
.silver .photo { background: var(--silver-soft); border: 2px solid var(--silver); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.initials { font: 900 40px/1 var(--display); letter-spacing: .02em; }
.gold .initials { color: var(--gold); }
.silver .initials { color: var(--silver); }
.photo-tools { position: absolute; inset: auto 6px 6px 6px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.btn { cursor: pointer; border: 0; border-radius: 8px; padding: 5px 8px; font-size: 11px; font-weight: 600; background: rgba(10,16,13,.82); color: var(--fg); backdrop-filter: blur(4px); }
.btn:hover { background: var(--green); color: var(--bg); }
.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
.medal-info { display: grid; gap: 6px; min-width: 0; }
.tier { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.gold .tier { color: var(--gold); }
.silver .tier { color: var(--silver); }
.medal-name { font: 800 28px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.medal-items { display: flex; flex-wrap: wrap; gap: 4px; }
.medal-items span { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.medal-items span i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--green); margin-left: 4px; }

.standings { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.standings td { padding: 7px 4px; border-top: 1px solid var(--line); font-size: 14px; }
.standings td.rk { width: 34px; font: 600 12px var(--mono); color: var(--muted); }
.standings td.n { text-align: right; font: 600 14px var(--mono); }
.board.lost .standings td.n { color: var(--lost); }
.board.found .standings td.n { color: var(--green); }
details.rest summary { cursor: pointer; color: var(--muted); font-size: 13px; padding-top: 6px; }
details.rest p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.fine { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; max-width: 80ch; }

/* editions */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.tab { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 10px; padding: 9px 14px; display: grid; gap: 2px; text-align: left; }
.tab b { font: 800 20px/1 var(--display); text-transform: uppercase; color: var(--fg); letter-spacing: .03em; }
.tab small { font: 400 11px/1.2 var(--mono); }
.tab[aria-selected="true"] { border-color: var(--green); background: var(--green-soft); }
.tab.soon b { color: var(--green); }
.ledger { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.col { min-width: 0; display: grid; gap: 8px; align-content: start; }
.col h3 { font: 800 22px/1 var(--display); text-transform: uppercase; margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; letter-spacing: .03em; }
.col.lost h3 { color: var(--lost); }
.col.found h3 { color: var(--green); }
.col h3 span { font: 600 12px var(--mono); color: var(--muted); }
.ticket { display: grid; grid-template-columns: 62px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ticket .no { font: 600 11px/1 var(--mono); color: var(--muted); display: grid; place-items: center; border-right: 1px dashed var(--line); background: var(--surface-2); letter-spacing: .04em; }
.col.lost .ticket .no { color: var(--lost); }
.col.found .ticket .no { color: var(--green); }
.ticket .body { padding: 10px 14px; display: grid; gap: 3px; min-width: 0; }
.ticket .what { font-weight: 600; overflow-wrap: anywhere; }
.ticket .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.ticket .meta .who { color: var(--fg); }
.ticket .meta .when { font-family: var(--mono); font-size: 12px; }
.ticket .note { font-size: 12.5px; color: var(--green); }
.ed-note { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--green-soft); font-size: 14px; }
.ed-note b { font: 800 15px var(--display); text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; color: var(--green); }

.soon-panel { background: var(--surface); border: 1px dashed var(--green); border-radius: var(--r); padding: 32px 24px; display: grid; gap: 18px; justify-items: start; }
.soon-panel h3 { font: 900 clamp(36px, 7vw, 64px)/.95 var(--display); text-transform: uppercase; margin: 0; }
.soon-panel p { margin: 0; color: var(--muted); max-width: 56ch; }
.clock { display: flex; gap: 10px; flex-wrap: wrap; }
.clock div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 76px; display: grid; gap: 4px; }
.clock b { font: 800 36px/1 var(--display); color: var(--green); font-variant-numeric: tabular-nums; }
.clock span { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* reunions */
.reunions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; }
.reunion { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.reunion .pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.reunion .pair .l { color: var(--lost); }
.reunion .pair .f { color: var(--green); }
.reunion .pair .arrow { color: var(--muted); font-family: var(--mono); }
.reunion .what { color: var(--fg); }
.reunion small { color: var(--muted); font-size: 12.5px; }
.tag { justify-self: start; font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; }
.tag.strong { background: var(--green-soft); color: var(--green); }
.tag.maybe { background: var(--gold-soft); color: var(--gold); }

footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--surface-2); color: var(--fg); border: 1px solid var(--green); border-radius: 10px; padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px); z-index: 10; }

@media (max-width: 820px) {
  .fame, .ledger { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 460px) {
  .medal { grid-template-columns: 92px minmax(0, 1fr); gap: 12px; }
  .photo { width: 92px; }
  .medal-name { font-size: 24px; }
  .initials { font-size: 32px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tab, .btn, .nav a { transition: background .15s, color .15s, border-color .15s; }
}
</style>
</head>

  function fmt(n) { return n.toLocaleString("en-IN"); }  var activeEd = 3;
  try { var saved = parseInt(localStorage.getItem("lf-edition"), 10); if (saved) activeEd = saved; } catch (e) {}
  if (/^#edition-(\d)$/.test(location.hash)) activeEd = parseInt(location.hash.slice(9), 10);

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function canon(n) { return ALIASES[n] || n; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function initials(n) { var p = n.replace(/\(.*?\)/g, "").trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1] || ""))).toUpperCase(); }

  function tally(kind) {
    var m = {};
    function add(name, item, n) { var k = canon(name); (m[k] = m[k] || { name: k, items: [] }).items.push({ item: item, ed: n }); }
    STATE.editions.forEach(function (ed) {
      (ed[kind] || []).forEach(function (it) { add(it.who, it.item, ed.n); });
      if (kind === "found") (ed.lost || []).forEach(function (it) { if (it.foundBy) add(it.foundBy, it.item + " (" + it.who + "'s)", ed.n); });
    });
    var arr = Object.keys(m).map(function (k) { return m[k]; });
    arr.sort(function (a, b) { return b.items.length - a.items.length || a.name.localeCompare(b.name); });
    var rank = 0, prev = null;
    arr.forEach(function (p) { if (p.items.length !== prev) { rank++; prev = p.items.length; } p.rank = rank; });
    return arr;
  }

  function countdown() {
    var ms = new Date(STATE.nextEdition.date).getTime() - Date.now();
    if (ms <= 0) return null;
    var s = Math.floor(ms / 1000);
    return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60) };
  }

  function photoHtml(name) {
    var src = STATE.photos[name];
    var h = src ? '<img src="' + esc(src) + '" alt="Photo of ' + esc(name) + '">' : '<span class="initials" aria-hidden="true">' + esc(initials(name)) + "</span>";
    if (canEdit) {
      var id = "ph-" + name.replace(/[^a-z0-9]/gi, "-").toLowerCase();
      h += '<div class="photo-tools"><label class="btn" for="' + id + '">' + (src ? "Change" : "Add photo") +
        '<input type="file" accept="image/*" id="' + id + '" data-photo="' + esc(name) + '"></label>' +
        (src ? '<button class="btn" type="button" data-remove="' + esc(name) + '">Remove</button>' : "") + "</div>";
    }
    return '<figure class="photo">' + h + "</figure>";
  }

  function board(kind) {
    var people = tally(kind);
    var verb = kind === "lost" ? "lost" : "found";
    var medals = people.filter(function (p) { return p.rank <= 2; }).map(function (p) {
      var tier = p.rank === 1 ? "gold" : "silver";
      var items = p.items.map(function (it) { return "<span>" + esc(it.item) + "<i>E" + it.ed + "</i></span>"; }).join("");
      return '<div class="medal ' + tier + '">' + photoHtml(p.name) +
        '<div class="medal-info"><div class="tier">' + (tier === "gold" ? "Gold" : "Silver") + " · " + p.items.length + " " + verb + "</div>" +
        '<div class="medal-name">' + esc(p.name) + '</div><div class="medal-items">' + items + "</div></div></div>";
    }).join("");
    var multi = people.filter(function (p) { return p.rank > 2 && p.items.length > 1; });
    var singles = people.filter(function (p) { return p.items.length === 1 && p.rank > 2; });
    var rows = multi.map(function (p) {
      return '<tr><td class="rk">#' + p.rank + "</td><td>" + esc(p.name) + '</td><td class="n">' + p.items.length + "</td></tr>";
    }).join("");
    return '<div class="board ' + kind + '"><div class="board-title"><h3>Most ' + verb + '</h3><span class="chip">' + people.length + " people</span></div>" +
      medals + (rows ? '<table class="standings"><tbody>' + rows + "</tbody></table>" : "") +
      (singles.length ? '<details class="rest"><summary>' + singles.length + " more with 1 item " + verb + "</summary><p>" +
        singles.map(function (p) { return esc(p.name); }).join(", ") + "</p></details>" : "") + "</div>";
  }

  function ticket(it, code) {
    var meta = '<span class="who">' + esc(it.who) + "</span>" +
      (it.date ? '<span class="when">' + esc(it.date) + "</span>" : "") +
      (it.place ? "<span>" + esc(it.place) + "</span>" : "");
    var note = it.foundBy ? "Found by " + it.foundBy : it.note;
    return '<div class="ticket"><div class="no">' + code + '</div><div class="body"><div class="what">' + esc(it.item) +
      '</div><div class="meta">' + meta + "</div>" + (note ? '<div class="note">' + esc(note) + "</div>" : "") + "</div></div>";
  }

  function editionPanel() {
    if (activeEd === STATE.nextEdition.n) {
      var c = countdown();
      return '<div class="soon-panel" id="edition-' + activeEd + '"><span class="eyebrow">Edition ' + pad2(activeEd) + "</span><h3>" +
        (c ? "Drops " + esc(STATE.nextEdition.label) : "Out now") + "</h3><p>" +
        (c ? "The next list of lost and found items lands on " + esc(STATE.nextEdition.label) + ". Check your bags before then." :
          "Edition " + activeEd + " is due. Its items will show up here once the list is added.") + "</p>" +
        (c ? '<div class="clock" data-clock><div><b>' + c.d + "</b><span>days</span></div><div><b>" + pad2(c.h) + "</b><span>hours</span></div><div><b>" + pad2(c.m) + "</b><span>minutes</span></div></div>" : "") + "</div>";
    }
    var ed = STATE.editions.filter(function (e) { return e.n === activeEd; })[0] || STATE.editions[STATE.editions.length - 1];
    var pre = "E" + ed.n + "-";
    return '<div id="edition-' + ed.n + '"><div class="ledger"><div class="col lost"><h3>Lost <span>' + ed.lost.length + " items</span></h3>" +
      ed.lost.map(function (it, i) { return ticket(it, pre + "L" + pad2(i + 1)); }).join("") +
      '</div><div class="col found"><h3>Found <span>' + ed.found.length + " items</span></h3>" +
      ed.found.map(function (it, i) { return ticket(it, pre + "F" + pad2(i + 1)); }).join("") + "</div></div>" +
      (ed.specialNote ? '<div class="ed-note"><b>Special note</b>' + esc(ed.specialNote) + "</div>" : "") + "</div>";
  }

  function tabs() {
    var t = STATE.editions.map(function (e) {
      return '<button class="tab" role="tab" type="button" data-ed="' + e.n + '" aria-selected="' + (e.n === activeEd) + '"><b>Edition ' + pad2(e.n) +
        "</b><small>" + e.lost.length + " lost · " + e.found.length + " found</small></button>";
    }).join("");
    var n = STATE.nextEdition.n;
    return t + '<button class="tab soon" role="tab" type="button" data-ed="' + n + '" aria-selected="' + (n === activeEd) + '"><b>Edition ' + pad2(n) +
      "</b><small>Drops " + esc(STATE.nextEdition.label) + "</small></button>";
  }

  function render() {
    var lost = 0, found = 0;
    STATE.editions.forEach(function (e) { lost += e.lost.length; found += e.found.length; });
    var c = countdown();
    app.innerHTML =
      '<div class="wrap">' +
      '<header class="top"><div class="brand"><span class="dot"></span>Altera Lost &amp; Found</div>' +
      '<div class="top-right"><nav class="nav"><a href="#fame">Hall of fame</a><a href="#editions">Editions</a><a href="#reunions">Reunions</a></nav>' +
      (ENABLE_LIKES ? '<button class="like" id="like-btn" type="button" aria-label="Like this page">' + HEART + '<span class="like-count" data-likes' + (likeCount == null ? " data-empty" : "") + ">" +
        (likeCount == null ? "Like" : fmt(likeCount)) + "</span></button>" : "") + "</div></header>" +

      '<section class="hero"><span class="eyebrow">Three editions in · Edition 04 on ' + esc(STATE.nextEdition.label) + "</span>" +
      '<h1>Lost <span class="amp">&amp;</span><br>Found</h1>' +
      '<p class="lede">Every umbrella, ID card and AirPod Altera has misplaced, the people who keep losing things, and the people who keep finding them.</p>' +
      '<div class="stats"><div class="stat lost"><b>' + lost + "</b><span>items lost</span></div>" +
      '<div class="stat found"><b>' + found + "</b><span>items found</span></div>" +
      '<div class="stat"><b>' + STATE.editions.length + "</b><span>editions so far</span></div>" +
      '<div class="stat next"><b data-days>' + (c ? c.d : 0) + "</b><span>" + (c ? "days until Edition " + pad2(STATE.nextEdition.n) : "Edition " + pad2(STATE.nextEdition.n) + " is out") + "</span></div></div></section>" +

      '<section id="fame"><div class="sec-head"><h2>Hall of fame</h2><p>Gold and silver for the most items lost and the most items found, across every edition so far.</p></div>' +
      '<div class="fame">' + board("lost") + board("found") + "</div>" +
      '<p class="fine">Names are counted as written, so "Gujarati Honey Jasmin" and Honey count as different people, and so do "Astro (Aditya)" and Aditya Konar. "Harshal" in Edition 1 and Harshal Acharya are counted separately too. Ashmi finding her own ID card does not count as a find.</p></section>' +

      '<section id="editions"><div class="sec-head"><h2>Editions</h2><p>Each item gets a claim number: E for edition, L for lost, F for found.</p></div>' +
      '<div class="tabs" role="tablist">' + tabs() + '</div><div id="ed-panel">' + editionPanel() + "</div></section>" +

      '<section id="reunions"><div class="sec-head"><h2>Possible reunions</h2><p>Lost items that line up with something found. Strong matches share a date, place or name.</p></div>' +
      '<div class="reunions">' + STATE.reunions.map(function (r) {
        return '<div class="reunion"><span class="tag ' + (r.strength === "strong" ? "strong" : "maybe") + '">' + (r.strength === "strong" ? "Strong match" : "Maybe") + "</span>" +
          '<div class="what">' + esc(r.what) + '</div><div class="pair"><span class="l">' + esc(r.lost) + '</span><span class="arrow">←</span><span class="f">' + esc(r.found) + "</span></div><small>" + esc(r.detail) + "</small></div>";
      }).join("") + "</div></section>" +

      '<footer><span>Altera Lost &amp; Found · Editions 01–03</span><span>Lost something? Make sure it makes it into Edition ' + pad2(STATE.nextEdition.n) + ".</span></footer>" +
      "</div>";
  }

  function toast(msg, sticky) {
    var t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg;
    clearTimeout(toastTimer);
    if (!sticky) toastTimer = setTimeout(function () { t.remove(); }, 4000);
  }

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var S = 360, c = document.createElement("canvas"), w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
        c.width = c.height = S;
        c.getContext("2d").drawImage(img, (w - s) / 2, (h - s) * 0.3, s, s, 0, 0, S, S);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }

  function buildDoc() {
    var resetEl = document.head.querySelector("style");
    var reset = resetEl ? resetEl.textContent : ":root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}";
    var json = JSON.stringify(STATE).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
      "<title>" + esc(document.title) + "</title>\n" +
      document.getElementById("lf-fonts").outerHTML + "\n" +
      '<style id="lf-css">' + document.getElementById("lf-css").textContent + "</style>\n" +
      '<main id="app"></main>\n' +
      '<script type="application/json" id="lf-state">' + json + SC + "\n" +
      '<script id="lf-main">' + document.getElementById("lf-main").textContent + SC +
      "</body></html>";
  }

  function setPhoto(name, value) {
    if (busy || !artifactApi) return;
    var before = STATE.photos[name];
    if (value) STATE.photos[name] = value; else delete STATE.photos[name];
    busy = true;
    render();
    toast("Saving photo…", true);
    artifactApi.publish(buildDoc()).then(function () {
      toast("Saved. Everyone will see it now.");
    }, function (e) {
      busy = false;
      var code = e && e.code;
      if (code === "conflict") { toast("Someone else saved first. Loading their version…"); return; }
      if (before) STATE.photos[name] = before; else delete STATE.photos[name];
      if (["not_writer", "not_granted", "consent_required", "not_declared", "capability_disabled", "capability_removed"].indexOf(code) >= 0) {
        canEdit = false;
        toast("This view is read-only, so photos can't be changed here.");
      } else if (code === "too_large") {
        toast("The page got too big with that photo. Try a smaller image.");
      } else if (code === "rate_limited") {
        toast("Too many saves in a row. Wait a minute, then try again.");
      } else {
        toast("The photo didn't save. Try again in a moment.");
      }
      render();
    });
  }

  function showLikes() {
    var el = document.querySelector("[data-likes]");
    if (!el || likeCount == null) return;
    el.textContent = fmt(likeCount);
    el.removeAttribute("data-empty");
  }

  function loadLikes() {
    if (!ENABLE_LIKES) return;
    fetch(LIKES_URL + "get/" + LIKES_KEY).then(function (r) {
      if (r.status === 404) return { value: 0 };
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) {
      if (typeof d.value === "number") { likeCount = Math.max(likeCount || 0, d.value + likePending); showLikes(); }
    }).catch(function () {});
  }

  // Sends queued clicks one at a time, spaced out to stay under the counter's rate limit.
  function sendLikes() {
    if (likeSending || likePending <= 0) return;
    likeSending = true;
    fetch(LIKES_URL + "hit/" + LIKES_KEY).then(function (r) {
      if (r.status === 429) throw new Error("slow");
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) {
      likePending--;
      if (typeof d.value === "number") { likeCount = Math.max(likeCount || 0, d.value + likePending); showLikes(); }
      setTimeout(function () { likeSending = false; sendLikes(); }, 400);
    }, function (err) {
      setTimeout(function () { likeSending = false; sendLikes(); }, err.message === "slow" ? 5000 : 3000);
    });
  }

  function floatHeart(btn) {
    var h = document.createElement("span");
    h.innerHTML = HEART;
    var svg = h.firstChild;
    svg.setAttribute("class", "float-heart");
    svg.style.setProperty("--dx", Math.round(Math.random() * 40 - 20) + "px");
    btn.appendChild(svg);
    setTimeout(function () { svg.remove(); }, 1200);
    btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  }

  app.addEventListener("click", function (e) {
    var like = e.target.closest("#like-btn");
    if (like) {
      floatHeart(like);
      likePending++;
      if (likeCount != null) { likeCount++; showLikes(); }
      sendLikes();
      return;
    }
    var tab = e.target.closest("[data-ed]");
    if (tab) {
      activeEd = parseInt(tab.getAttribute("data-ed"), 10);
      try { localStorage.setItem("lf-edition", String(activeEd)); } catch (err) {}
      document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t === tab)); });
      document.getElementById("ed-panel").innerHTML = editionPanel();
      return;
    }
    var rm = e.target.closest("[data-remove]");
    if (rm) setPhoto(rm.getAttribute("data-remove"), null);
  });

  app.addEventListener("change", function (e) {
    var input = e.target.closest("input[data-photo]");
    if (!input || !input.files || !input.files[0]) return;
    var name = input.getAttribute("data-photo");
    shrink(input.files[0]).then(function (url) { setPhoto(name, url); }, function () {
      toast("That file couldn't be read as an image. Try a JPG or PNG.");
    });
  });

  setInterval(function () {
    var c = countdown(), d = document.querySelector("[data-days]");
    if (d && c) d.textContent = c.d;
    var clock = document.querySelector("[data-clock]");
    if (clock && c) { var b = clock.querySelectorAll("b"); b[0].textContent = c.d; b[1].textContent = pad2(c.h); b[2].textContent = pad2(c.m); }
    if (!document.hidden) loadLikes();
  }, 30000);

  render();
  loadLikes();
})();
</script>
</body>
</html>
